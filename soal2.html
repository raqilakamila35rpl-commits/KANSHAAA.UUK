<!DOCTYPE html>

<body>
  <h2>Rekap Upah Pekerja Harian</h2>

  <tr
    <label for="pekerja">Nama Pekerja:</label><br />
    <input type="text" id="pekerja" placeholder="Masukkan nama pekerja" />
  </tr>
  <br />

  <tr
    <label for="jamKerja">Jumlah Jam Kerja:</label><br />
    <input type="number" id="jamKerja" placeholder="0" />
  </tr>
  <br />

  <tr>
    <label for="upahJam">Upah per Jam (Rp):</label><br />
    <input type="number" id="upahJam" placeholder="0" />
  </tr>
  <br />

  <button id="btnSimpan" type="button">Simpan</button>

  <hr />
  <p id="hasil"></p>
